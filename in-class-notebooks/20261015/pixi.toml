[workspace]
channels = ["conda-forge"]
name = "om522-critical-path"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks.check]
cmd = "marimo check critical_path.py"

[tasks.demo]
cmd = "marimo edit critical_path.py"

[dependencies]
python = "3.12.*"
polars = ">=1.44.2,<2"
matplotlib = ">=3.10.9,<4"
seaborn = ">=0.13.2,<0.14"
marimo = ">=0.24.0,<0.25"
networkx = ">=3.7,<4"
