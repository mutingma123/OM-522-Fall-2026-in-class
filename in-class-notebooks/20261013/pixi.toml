[workspace]
channels = ["conda-forge"]
name = "om522-eligible-machines"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks.data]
cmd = "python generate_eligibility_data.py"

[tasks.check]
cmd = "marimo check eligible_machines.py"

[tasks.demo]
cmd = "marimo edit eligible_machines.py"

[tasks.test]
cmd = "python -m pytest -q"
env = { MPLBACKEND = "Agg" }

[dependencies]
python = "3.12.*"
polars = ">=1.44.2,<2"
matplotlib = ">=3.10.9,<4"
seaborn = ">=0.13.2,<0.14"
marimo = ">=0.24.0,<0.25"
pytest = ">=9.1.1,<10"
